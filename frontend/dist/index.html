<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nawala Checker</title>
    
  <script type="module" crossorigin src="/assets/index.e40eb722.js"></script>
  <link rel="stylesheet" href="/assets/index.c1fba744.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Nawala Checker</h1>
            <p class="subtitle">Cek status blokir domain di TrustPositif (Komdigi/Kominfo)</p>
        </header>

        <main>
            <div class="input-section">
                <div class="input-header">
                    <label for="domains">Alamat Web (URL/Domain)</label>
                    <button id="btnLoadFile" class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        Pilih File .txt
                    </button>
                </div>
                <textarea id="domains" placeholder="Masukkan alamat web di sini, satu per baris.&#10;Contoh:&#10;reddit.com&#10;https://vimeo.com&#10;detik.com"></textarea>
                
                <details class="advanced-settings">
                    <summary>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        Pengaturan Lanjutan
                    </summary>
                    <div class="settings-grid">
                        <div class="setting-item">
                            <label for="workers">Worker (Bersamaan)</label>
                            <input type="number" id="workers" value="10" min="1" max="100"/>
                        </div>
                        <div class="setting-item">
                            <label for="timeout">Timeout (detik)</label>
                            <input type="number" id="timeout" value="15" min="1" max="60"/>
                        </div>
                        <div class="setting-item">
                            <label for="retries">Coba Ulang (Retry)</label>
                            <input type="number" id="retries" value="3" min="0" max="10"/>
                        </div>
                    </div>
                </details>

                <div class="actions">
                    <button id="btnStart" class="btn-primary">Mulai Pengecekan</button>
                    <button id="btnStop" class="btn-danger" disabled>Berhenti</button>
                    <button id="btnExport" class="btn-secondary" disabled>Simpan CSV</button>
                </div>
            </div>

            <div class="results-section">
                <div class="results-header">
                    <h2>Hasil Pengecekan</h2>
                    <span id="statusText">Siap.</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                
                <div class="table-container">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Domain</th>
                                <th>Status</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <!-- Results go here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer>
            <span id="footerText"></span>
        </footer>
    </div>

    
</body>
</html>
